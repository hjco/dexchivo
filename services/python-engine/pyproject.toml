[project]
name = "chivo-python-engine"
version = "0.1.0"
description = "Signal-generation and analytics engine. No exchange credentials, no order execution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.121,<1.0",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.12,<3.0",
  "uvicorn[standard]>=0.38,<1.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chivo_python_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=chivo_python_engine --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeStubs = false
